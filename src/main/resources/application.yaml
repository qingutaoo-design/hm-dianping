server:
  port: 8081
spring:
  kafka:
    bootstrap-servers: localhost:9094,localhost:9095,localhost:9096
    listener:
      ack-mode: manual
    consumer:
      auto-offset-reset: earliest
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    #需要修改为自己的pwd
    password: ######
  redis:
    host: 127.0.0.1
    port: 6379
    #需要修改为自己的pwd
    password: ######
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 1
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug
hm-dianping:
  alioss:
  #需修改为自己的access-key
    access-key-id: #######
    access-key-secret: #######
    bucket-name: #####
    endpoint: oss-cn-beijing.aliyuncs.com
